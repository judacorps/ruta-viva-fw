<style>
/* Layout: mapa a pantalla completa. Teléfono: búsqueda flotante arriba y hoja deslizable abajo.
   Escritorio (>=900px): panel fijo de 400px a la izquierda (búsqueda + contenido) y mapa a la derecha. */
:root{
  --bg:#e8edeb; --surface:#ffffff; --surface-2:#f1f5f3; --fg:#14211d; --muted:#56675f; --line:#d5ded9;
  --accent:#0a7468; --accent-fg:#ffffff; --accent-soft:#dcf0ec; --led:#ffb320; --led-bg:#16201c; --warn:#a34f00;
  --shadow:0 8px 28px rgba(15,35,30,.18); --shadow-sm:0 2px 8px rgba(15,35,30,.14);
  --m-land:#eef1ec; --m-water:#a9cfe3; --m-river:#86bbd8; --m-park:#d3e7cb; --m-road:#ffffff; --m-casing:#c6cec8; --m-low:#c3cac4;
  --m-motorway:#f3c66d; --m-motorway-c:#cf9e46; --m-trunk:#f7da96; --m-label:#3a4945; --m-halo:#ffffff; --m-water-label:#2c6c93; --m-route-casing:#ffffff;
  --font-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-sign:"Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --peek:196px; --panel:400px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1412; --surface:#161e1b; --surface-2:#1e2825; --fg:#e6eeeb; --muted:#9daea8; --line:#2b3733;
    --accent:#3bc4b2; --accent-fg:#04201b; --accent-soft:#173833; --led:#ffb320; --led-bg:#090e0c; --warn:#ffb36b;
    --shadow:0 8px 28px rgba(0,0,0,.55); --shadow-sm:0 2px 8px rgba(0,0,0,.5);
    --m-land:#141b19; --m-water:#1b3443; --m-river:#2a5570; --m-park:#192b21; --m-road:#34413d; --m-casing:#0c1210; --m-low:#2e3a36;
    --m-motorway:#6e5c2e; --m-motorway-c:#2c2514; --m-trunk:#51472a; --m-label:#b6c5bf; --m-halo:#0f1513; --m-water-label:#7ab4d6; --m-route-casing:#0e1412;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#161e1b; --surface-2:#1e2825; --fg:#e6eeeb; --muted:#9daea8; --line:#2b3733;
  --accent:#3bc4b2; --accent-fg:#04201b; --accent-soft:#173833; --led:#ffb320; --led-bg:#090e0c; --warn:#ffb36b;
  --shadow:0 8px 28px rgba(0,0,0,.55); --shadow-sm:0 2px 8px rgba(0,0,0,.5);
  --m-land:#141b19; --m-water:#1b3443; --m-river:#2a5570; --m-park:#192b21; --m-road:#34413d; --m-casing:#0c1210; --m-low:#2e3a36;
  --m-motorway:#6e5c2e; --m-motorway-c:#2c2514; --m-trunk:#51472a; --m-label:#b6c5bf; --m-halo:#0f1513; --m-water-label:#7ab4d6; --m-route-casing:#0e1412;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h2,h3{text-wrap:balance;margin:0}
#app{position:relative;height:100%;overflow:hidden}
#map{position:absolute;inset:0;background:var(--m-land);z-index:0}
#ui{display:contents}

/* ---- barra superior ---- */
#topbar{position:absolute;top:0;left:0;right:0;z-index:1000;padding:12px max(16px, env(safe-area-inset-right,0px)) 0 max(16px, env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
#topbar>*{pointer-events:auto}
.search{position:relative;display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:3px 5px 3px 12px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-size:16px;padding:10px 6px;outline:none}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}
.iconbtn{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--fg);flex:none}
.iconbtn:hover{background:var(--surface-2)}
#micBtn.listening{background:var(--accent);color:var(--accent-fg);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--accent-soft)}}
#chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;flex:none;max-width:260px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow-sm);font-size:13.5px;white-space:nowrap}
.chip span{overflow:hidden;text-overflow:ellipsis}
.chip .ic{color:var(--accent);display:grid}
.live-dot{width:8px;height:8px;border-radius:50%;background:#2fb344;box-shadow:0 0 0 3px rgba(47,179,68,.2);flex:none}
.live-dot.sim{background:var(--led);box-shadow:0 0 0 3px rgba(255,179,32,.25)}
#suggest{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:52vh;overflow-y:auto;padding:6px}
.sg{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:10px;min-height:44px}
.sg:hover,.sg:focus-visible{background:var(--surface-2)}
.sg b{font-weight:700}
.sg .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.sg small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg .go{color:var(--accent)}

/* ---- hoja inferior / panel ---- */
#sheet{position:absolute;left:0;right:0;bottom:0;height:var(--peek);z-index:900;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:height .28s cubic-bezier(.2,.8,.2,1)}
#sheet[data-s="1"]{height:48%}
#sheet[data-s="2"]{height:88%}
#handle{flex:none;display:flex;justify-content:center;align-items:center;height:26px;border:0;background:transparent;width:100%;cursor:grab;touch-action:none}
#handle span{width:44px;height:5px;border-radius:3px;background:var(--line)}
#body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 max(16px, env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
#fabs{position:absolute;right:max(16px, env(safe-area-inset-right,0px));bottom:calc(var(--peek) + 14px);z-index:800;display:flex;flex-direction:column;gap:10px}
.fab{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);box-shadow:var(--shadow-sm);display:grid;place-items:center}
.fab[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}
#banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1100;background:var(--led-bg);color:var(--led);font:700 18px/1.2 var(--font-sign);letter-spacing:.05em;text-transform:uppercase;padding:12px 14px 12px 18px;border-radius:12px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);pointer-events:auto;max-width:calc(100% - 32px)}
#banner button{border:0;border-radius:8px;background:rgba(255,255,255,.12);color:#fff;font:600 14px var(--font-body);text-transform:none;letter-spacing:0;padding:8px 10px}
.picking #map{cursor:crosshair}
#toast{position:absolute;left:50%;top:132px;transform:translateX(-50%);z-index:1200;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:14px;max-width:calc(100% - 32px);text-align:center}
#loading{position:absolute;inset:0;z-index:2000;display:grid;place-items:center;background:var(--bg);color:var(--fg);text-align:center;padding:24px}
#loading .led{justify-content:center;margin-bottom:12px}

@media (max-width:899px){
  .leaflet-bottom{bottom:var(--peek)}
}
@media (min-width:900px){
  #ui{display:flex;flex-direction:column;position:absolute;left:0;top:0;bottom:0;width:var(--panel);z-index:1000;background:var(--surface);border-right:1px solid var(--line)}
  #topbar{position:relative;padding:16px 16px 10px}
  .search{box-shadow:none;background:var(--surface-2)}
  .chip{box-shadow:none}
  #suggest{position:absolute;left:16px;right:16px;top:64px;z-index:5}
  #sheet,#sheet[data-s]{position:relative;flex:1;min-height:0;height:auto;border-radius:0;box-shadow:none;transition:none}
  #handle{display:none}
  #body{padding:4px 16px 24px}
  #map{left:var(--panel)}
  #fabs{bottom:28px}
  #toast{left:calc(var(--panel) + (100% - var(--panel))/2);top:24px}
  #banner{left:calc(var(--panel) + (100% - var(--panel))/2)}
}

/* ---- contenido de vistas ---- */
.vh{display:flex;align-items:flex-start;gap:6px;padding:4px 0 12px}
.vh .iconbtn{margin-left:-8px}
.vt{flex:1;min-width:0;padding-top:6px}
.vt h2{font:700 25px/1.05 var(--font-sign);letter-spacing:.01em}
.vt h2.hero{font-size:30px}
.sub{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.sub .pulse,.sub .cdot{margin-right:6px;vertical-align:1px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.qchip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;min-height:40px}
.qchip:hover{border-color:var(--accent)}
.card{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface-2)}
.origin-card{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.origin-card.need{flex-direction:column;align-items:stretch;background:var(--accent-soft);border-color:transparent}
.origin-card .ic{color:var(--accent);display:grid}
.origin-card>div{flex:1;min-width:0;display:flex;flex-direction:column}
.origin-card small{color:var(--muted)}
.origin-card b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-fg);font-weight:700}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.wide{width:100%}
.menu{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.mitem{display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:left;padding:10px 6px;border-radius:12px;color:var(--accent)}
.mitem:hover{background:var(--surface-2)}
.mitem span{display:flex;flex-direction:column;color:var(--fg)}
.mitem small{color:var(--muted)}
.fine{color:var(--muted);font-size:12.5px;line-height:1.5;margin:10px 0 0;max-width:62ch}
.pulse{width:8px;height:8px;border-radius:50%;background:#2fb344;display:inline-block}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:26px;padding:0 7px;border-radius:6px;background:var(--c);color:var(--t);font:700 16px/1 var(--font-sign);letter-spacing:.02em;flex:none;white-space:nowrap}
.chev{color:var(--muted);margin:0 2px}
.cdot{width:10px;height:10px;border-radius:50%;background:var(--k);flex:none;display:inline-block}
.led{display:flex;align-items:center;gap:10px;background:var(--led-bg);color:var(--led);border-radius:10px;padding:9px 12px;font:700 19px/1.1 var(--font-sign);text-transform:uppercase;letter-spacing:.06em;text-shadow:0 0 8px rgba(255,179,32,.4);min-width:0}
.led span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.led.big{font-size:23px;padding:12px 14px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 2px;min-height:48px}
.li:hover{background:var(--surface-2)}
.li .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.li small{color:var(--muted)}
.tm{font:700 17px/1 var(--font-sign);font-variant-numeric:tabular-nums;white-space:nowrap}
.in{color:var(--accent);font-weight:700;font-size:13px;white-space:nowrap}
.res{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.res-item{display:flex;gap:12px;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:12px}
.res-item:hover{border-color:var(--accent)}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font:700 15px var(--font-sign)}
.rb{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.rt{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rt b{overflow:hidden;text-overflow:ellipsis}
.arr{font:700 17px var(--font-sign);white-space:nowrap;color:var(--accent)}
.rm{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:13.5px}
.rm>span:last-child{margin-left:6px;color:var(--muted)}
.rs{color:var(--muted);font-size:12.5px}
.warn{color:var(--warn);font-weight:700}
.sum{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.sum .times{display:flex;align-items:baseline;gap:10px;font:700 30px/1 var(--font-sign);font-variant-numeric:tabular-nums}
.sum .times span{color:var(--muted);font-size:22px}
.sum .meta{color:var(--muted)}
.legs{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column}
.leg{display:flex;gap:12px;padding:10px 0;position:relative}
.leg .lic{flex:none;width:34px;display:flex;flex-direction:column;align-items:center;color:var(--muted)}
.leg .lic::after{content:"";flex:1;width:3px;margin-top:6px;border-radius:2px;background:repeating-linear-gradient(var(--muted) 0 4px,transparent 4px 9px);opacity:.6}
.leg.ride .lic::after{background:var(--c);opacity:1}
.leg.ride .lic{color:var(--fg)}
.leg:last-child .lic::after{display:none}
.lb{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.lb p{margin:0}
.lb .muted{color:var(--muted);font-size:13.5px}
.live{font-size:13.5px;color:var(--accent);font-weight:700}
.link{border:0;background:transparent;color:var(--accent);font-weight:700;padding:6px 0;text-align:left;text-decoration:underline;text-underline-offset:3px}
h3.sec{font:700 18px var(--font-sign);letter-spacing:.02em;margin:18px 0 6px;color:var(--muted);text-transform:uppercase}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 12px;font-size:13.5px;min-height:38px}
.tab[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.stoprow{position:relative;padding-left:24px}
.stoprow::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:4px;background:var(--c)}
.stoprow:first-child::before{top:50%}
.stoprow:last-child::before{bottom:50%}
.stoprow::after{content:"";position:absolute;left:0;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--surface);border:4px solid var(--c)}
.near{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.near span{font-size:11.5px;border-radius:6px;padding:1px 6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;margin:8px 0;font-size:13.5px;color:var(--muted)}
.field input{font:inherit;font-size:16px;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ext{color:var(--accent);font-weight:700}
.link.inline{padding:0;font-size:inherit}
.countdown{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
.countdown .led{font-size:24px}
.cd-sub{margin:0;color:var(--muted);font-size:13.5px}
.go-now,.go-later{margin:0;border-radius:10px;padding:9px 12px;font-weight:700;font-size:14px}
.go-later{background:var(--accent-soft);color:var(--fg)}
.go-now{background:var(--led);color:#1b1300}
.chip.trip{background:var(--led-bg);color:var(--led);border-color:transparent;font:700 15px var(--font-sign);letter-spacing:.04em;text-transform:uppercase;padding-left:5px}
.chip.trip .badge{height:24px;min-width:30px;font-size:14px}
.nx{align-items:center;gap:6px;margin-top:6px}
.nx span:not(.badge){background:transparent;border:0;padding:0;color:var(--fg);font-size:13px;font-weight:700;margin-right:6px}
.near .badge{background:var(--c);color:var(--t);border:0;padding:0 6px;height:22px;min-width:28px;font-size:14px;border-radius:5px}
/* banderitas de "súbete / bájate aquí" */
.sf{position:absolute;left:0;top:0}
.sf i{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--surface);border:5px solid var(--c);box-shadow:0 1px 4px rgba(0,0,0,.45)}
.sf-chip{position:absolute;left:0;bottom:14px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;background:var(--c);color:var(--t);border-radius:10px;padding:5px 10px 6px;box-shadow:0 3px 10px rgba(0,0,0,.35);white-space:nowrap;line-height:1.2;cursor:pointer}
.sf-chip::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:6px solid var(--c)}
.sf-chip b{font:700 15px var(--font-sign);letter-spacing:.04em;text-transform:uppercase}
.sf-chip span{font-size:12px;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.sf.off .sf-chip{bottom:auto;top:14px}
.sf.off .sf-chip::after{bottom:auto;top:-6px;border-top:0;border-bottom:6px solid var(--c)}
.leaflet-tooltip.stoplbl{background:var(--surface);color:var(--fg);border:1px solid var(--line);box-shadow:none;padding:1px 6px;font:700 11.5px var(--font-body)}
.leaflet-tooltip.stoplbl::before{display:none}

.bus-icon .bus.rail{border-radius:8px;width:34px}
.bus-icon .bus.dim{opacity:.25}
.bus-icon .bus.mine{outline:3px solid var(--led);outline-offset:2px;z-index:2}
.z-low .bus-icon .bus{width:13px;height:13px;font-size:0;border-width:1.5px}
.z-low .bus-icon .bus.rail{width:15px}
.z-low .bus-icon .bus .dir{display:none}
.me{width:20px;height:20px;border-radius:50%;background:#2f7cf6;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,124,246,.25),0 1px 4px rgba(0,0,0,.4)}
.me.manual{background:var(--fg);border-color:var(--surface);box-shadow:0 0 0 5px rgba(0,0,0,.12),0 1px 4px rgba(0,0,0,.4)}
.pinmk{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--k,var(--accent));border:2px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.35);display:grid;place-items:center}
.pinmk b{transform:rotate(45deg);color:#fff;font:700 15px var(--font-sign)}
.leaflet-container{font-family:var(--font-body);background:var(--m-land)}
.leaflet-control-attribution{background:color-mix(in srgb, var(--surface) 82%, transparent)!important;color:var(--muted)!important;font-size:10.5px}
.leaflet-control-attribution a{color:var(--accent)!important}
.leaflet-control-zoom a{background:var(--surface)!important;color:var(--fg)!important;border-color:var(--line)!important}

<script>
(() => {
'use strict';

/* ================= Constantes ================= */
const TZ = 'America/Chicago';
const WALK = 1.25, DETOUR = 1.3;           // m/s y factor de calles vs línea recta

const XFER_BUF = 60, MAXR = 3;             // segundos de margen al transbordar; máx. autobuses
const INF = 1e9;
const CAT_COLOR = { super:'#2f9e44', tienda:'#1c7ed6', conv:'#74b816', farmacia:'#d6336c', salud:'#e03131', comida:'#e8590c',
  banco:'#5f3dc4', educacion:'#1098ad', gobierno:'#5c6b73', gas:'#c2410c', diversion:'#0ca678', hotel:'#ae3ec9', servicios:'#868e96' };
const CAT_WORDS = {

  gobierno:['correo','oficina de correos','post office','gobierno','policia','city hall','corte'],
  diversion:['parque','museo','zoologico','zoo','cine','estadio','gimnasio','park','museum'],
  hotel:['hotel','motel'],
  tienda:['tienda','tiendas','mall','centro comercial','store'],
  conv:['conveniencia','tiendita'],
};
const SYN = { 'centro':'central station', 'downtown':'central station', 'estacion central':'central station', 'el centro':'central station',
  'aeropuerto':'dfw airport', 'airport':'dfw airport', 'stock yards':'stockyards', 'los stockyards':'stockyards' };
const QUICK = [['Walmart','walmart'],['Supermercado','supermercado'],['Farmacia','farmacia'],['Hospital','hospital'],['Central Station','central station'],['Stockyards','stockyards']];
const ICON = {
  search:'<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',

  gps:'<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="3.6" fill="currentColor"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  store:'<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9.5 5.5 4h13L20 9.5M4 9.5h16M4 9.5a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0 2.7 2.7 0 0 0 5.3 0M5.5 12v8h13v-8M10 20v-5h4v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
  info:'<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="7.5" r="1.3" fill="currentColor"/></svg>',
  back:'<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',

  bus:'<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="4" y="3" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 11h16M7.5 21v-3M16.5 21v-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="8" cy="14.5" r="1.2" fill="currentColor"/><circle cx="16" cy="14.5" r="1.2" fill="currentColor"/></svg>',

};

/* ================= Utilidades ================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9&\s'-]/g, ' ').replace(/\s+/g, ' ').trim();
const load = k => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } };
const distM = (la1, lo1, la2, lo2) => Math.hypot((lo2 - lo1) * 111320 * Math.cos(la1 * Math.PI / 180), (la2 - la1) * 110540);
const walkSec = d => d * DETOUR / WALK;
function fmtTime(sec) {
  sec = ((Math.round(sec / 60) * 60) % 86400 + 86400) % 86400;
  let h = Math.floor(sec / 3600); const m = Math.floor(sec / 60) % 60;
  const ap = h < 12 ? 'a. m.' : 'p. m.'; h = h % 12 || 12;
  return `${h}:${String(m).padStart(2, '0')} ${ap}`;
}
function fmtDur(sec) { const m = Math.max(1, Math.round(sec / 60)); if (m < 60) return m + ' min'; return Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : ''); }
function fmtMi(m) { const mi = m / 1609.344; if (mi < 0.1) return Math.max(50, Math.round(m * 3.28084 / 50) * 50) + ' ft'; return mi.toFixed(mi < 10 ? 1 : 0) + ' mi'; }
function contrastText(hex) { const n = parseInt(hex, 16); const r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255; return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#111111' : '#ffffff'; }
function routeLabel(r) {
  const s = r.s || '';
  if (/^\d+$/.test(s)) return String(parseInt(s, 10));
  const map = { 'Orange Line':'ORG', 'Blue Line':'BLU', 'TEXRail':'TEX' };
  return map[s] || s.slice(0, 4).toUpperCase();
}

/* ================= Tiempo (zona de Fort Worth) ================= */
const fmtParts = new Intl.DateTimeFormat('en-US', { timeZone: TZ, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23' });
function partsAt(ms) { const o = {}; for (const p of fmtParts.formatToParts(new Date(ms))) o[p.type] = p.value; return { y:+o.year, m:+o.month, d:+o.day, h:(+o.hour) % 24, mi:+o.minute, s:+o.second }; }
const S = { offset: 0, origin: load('rv.origin'), stack: [], selRoute: -1, follow: null, showPlaces: true, itin: null, itinKeys: null,
  pending: null, picking: false, now: null, day: null, activeCount: 0, activeByRoute: [], lastLive: 0, sheet: 0 };
const nowMs = () => Date.now() + S.offset;
function clock() { const p = partsAt(nowMs()); return { date: p.y * 10000 + p.m * 100 + p.d, secs: p.h * 3600 + p.mi * 60 + p.s }; }
function zonedToMs(y, m, d, h, mi) { const g = Date.UTC(y, m - 1, d, h, mi); const p = partsAt(g); const asUtc = Date.UTC(p.y, p.m - 1, p.d, p.h, p.mi, p.s); return g - (asUtc - g); }

  for (const { s, d } of searchStops(qq, ref).slice(0, 4)) out.push(`<button type="button" class="sg" data-act="${forOrigin ? 'fromstop' : 'stop'}" data-s="${s}"><span class="go">${ICON.bus}</span><span class="grow"><b>${esc(T.stops.n[s])}</b><small>Parada ${esc(T.stops.c[s])}</small></span><span class="in">${fmtMi(d)}</span></button>`);
  return out.join('') || '<p class="fine" style="padding:8px">Sin resultados.</p>';
}
function act(el) {
  const a = el.dataset.act, d = el.dataset;
  switch (a) {
    case 'back': back(); break;
    case 'cmd': $('#q').value = d.q; runCommand(d.q); break;
    case 'gps': useGPS(); break;
    case 'pickmap': startPick(); break;
    case 'origin': openView({ type: 'origin' }, { expand: true }); break;
    case 'routes': openView({ type: 'routes' }, { expand: true }); break;
    case 'nearby': openView({ type: 'nearby' }, { expand: true }); break;
    case 'nearstops': openView({ type: 'nearstops' }, { expand: true }); break;
    case 'zoomstop': { const s = +d.s; map.setView([T.stops.lat[s], T.stops.lon[s]], 17); if (window.innerWidth < 900) setSheet(0); break; }
    case 'time': openView({ type: 'time' }, { expand: true }); break;
    case 'route': hideSuggest(); openView({ type: 'route', r: +d.r }, { expand: true }); break;
    case 'dir': topView().dir = +d.d; render(); break;
    case 'stop': hideSuggest(); openView({ type: 'stop', s: +d.s }, { expand: true }); break;
    case 'place': hideSuggest(); openView({ type: 'place', i: +d.p }, { expand: true }); break;
    case 'bus': openView({ type: 'bus', key: d.k }, { expand: true }); break;
    case 'cat': topView().cat = d.c; render(); break;
    case 'go': {
      const p = P.list[+d.p];
      if (!S.origin) { S.pending = p.name; openView({ type: 'origin', reason: p.name }, { expand: true }); break; }
      planAndShow([placeDest(p)], p.name); break;
    }
    case 'gostop': {
      const s = +d.s;
      if (!S.origin) { S.pending = T.stops.n[s]; openView({ type: 'origin', reason: T.stops.n[s] }, { expand: true }); break; }
      planAndShow([stopDest(s)], T.stops.n[s]); break;
    }
    case 'fromplace': { const p = P.list[+d.p]; hideSuggest(); setOrigin({ lat: p.lat, lon: p.lon, label: p.name }); break; }
    case 'fromstop': { const s = +d.s; hideSuggest(); setOrigin({ lat: T.stops.lat[s], lon: T.stops.lon[s], label: T.stops.n[s] }); break; }
    case 'addr': hideSuggest(); geocodeAndGo(d.q, false); break;
    case 'addrfrom': geocodeAndGo(d.q, true); break;
    case 'gopoint': {
      const v = topView(), dest = { type: 'addr', name: v.label || 'Punto en el mapa', sub: 'Punto que elegiste en el mapa', lat: v.lat, lon: v.lon };
      if (!S.origin) { toast('Primero dime desde dónde sales.'); openView({ type: 'origin' }, { expand: true }); break; }
      planAndShow([dest], dest.name); break;
    }
    case 'frompoint': { const v = topView(); setOrigin({ lat: v.lat, lon: v.lon, label: v.label || 'Punto en el mapa' }); break; }
    case 'res': openItin(topView(), +d.i); break;
    case 'alt': { const v = topView(); const j = v.later[+d.i]; openView({ type: 'itin', item: v.item, j, later: [], date: v.date }, { replace: true }); break; }
    case 'opt': { const v = topView(); const j = v.item.opts[+d.i]; openView({ type: 'itin', item: v.item, j, later: j.walkOnly ? [] : laterJourneys(S.origin, v.item.dest, dayIndex(v.date), j, 3), date: v.date }, { replace: true }); break; }
    case 'follow': {
      S.follow = d.k; const m = buses.get(d.k);
      if (m) { map.setView(m.getLatLng(), Math.max(map.getZoom(), 15)); if (window.innerWidth < 900) setSheet(false); toast('Siguiendo tu autobús. Mueve el mapa para dejar de seguirlo.'); }
      else toast('Ese autobús todavía no sale. Aparecerá en el mapa cuando empiece su recorrido.');
      if (topView().type === 'bus') render();
      break;
    }
    case 'unfollow': S.follow = null; render(); break;
    case 'applytime': {
      const dv = $('#td').value, tv = $('#tt').value; if (!dv || !tv) break;
      const [y, mo, da] = dv.split('-').map(Number), [hh, mi] = tv.split(':').map(Number);
      S.offset = zonedToMs(y, mo, da, hh, mi) - Date.now(); tick(); toast('Mostrando ' + fmtDate(y * 10000 + mo * 100 + da) + ', ' + fmtTime(hh * 3600 + mi * 60)); back(); break;
    }
    case 'livetime': S.offset = 0; tick(); toast('De vuelta en vivo'); back(); break;
  }
}
function initUI() {
  document.querySelectorAll('[data-i]').forEach(el => { el.innerHTML = ICON[el.dataset.i] || ''; });
  document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el) { e.preventDefault(); act(el); } });
  const q = $('#q'), sug = $('#suggest');
  q.addEventListener('input', () => {
    $('#clearBtn').hidden = !q.value;
    if (q.value.trim().length < 2) { sug.hidden = true; return; }
    sug.innerHTML = suggestHtml(q.value, false); sug.hidden = false;
  });
  q.addEventListener('focus', () => { if (q.value.trim().length >= 2) { sug.innerHTML = suggestHtml(q.value, false); sug.hidden = false; } });
  q.addEventListener('keydown', e => { if (e.key === 'Escape') hideSuggest(); });
  $('#searchForm').addEventListener('submit', e => { e.preventDefault(); runCommand(q.value); });
  $('#clearBtn').addEventListener('click', () => { q.value = ''; $('#clearBtn').hidden = true; hideSuggest(); q.focus(); });
  $('#body').addEventListener('input', e => {
    if (e.target.id === 'oq') { const v = e.target.value; $('#osug').innerHTML = v.trim().length >= 2 ? suggestHtml(v, true) : ''; }
  });
  $('#body').addEventListener('keydown', e => {
    if (e.target.id !== 'oq' || e.key !== 'Enter') return;
    e.preventDefault();
    const v = e.target.value.trim(); if (!v) return;
    if (looksLikeAddress(v)) { geocodeAndGo(stripCommand(v), true); return; }
    const first = $('#osug [data-act="fromplace"], #osug [data-act="fromstop"]');
    if (first) act(first); else geocodeAndGo(stripCommand(v), true);
  });
  $('#originChip').addEventListener('click', () => openView({ type: 'origin' }, { expand: true }));
  $('#clockChip').addEventListener('click', () => openView({ type: 'time' }, { expand: true }));
  $('#tripChip').addEventListener('click', () => { if (!S.trip) return; if (topView() !== S.trip.view) openView(S.trip.view, { expand: true }); else setSheet(true); });
  $('#locBtn').addEventListener('click', () => { if (S.origin && S.origin.gps) map.setView([S.origin.lat, S.origin.lon], 15); else useGPS(); });
  $('#placesBtn').addEventListener('click', e => {
    S.showPlaces = !S.showPlaces; e.currentTarget.setAttribute('aria-pressed', S.showPlaces); refreshPlaces();
    toast(S.showPlaces ? (map.getZoom() < 16 ? 'Acerca el mapa para ver los negocios' : 'Negocios visibles') : 'Negocios ocultos');
  });
  $('#infoBtn').addEventListener('click', () => openView({ type: 'about' }, { expand: true }));
  $('#pickCancel').addEventListener('click', () => { endPick(); S.pending = null; });
  // hoja deslizable
  const h = $('#handle'); let y0 = null;
  h.addEventListener('pointerdown', e => { y0 = e.clientY; h.setPointerCapture(e.pointerId); });
  h.addEventListener('pointerup', e => { if (y0 === null) return; const dy = e.clientY - y0; y0 = null; if (dy < -25) setSheet(S.sheet + 1); else if (dy > 25) setSheet(S.sheet - 1); else setSheet(S.sheet ? 0 : 1); });
  h.addEventListener('click', e => e.preventDefault());
  h.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setSheet(S.sheet ? 0 : 1); } });
  $('#body').addEventListener('scroll', () => { if (S.sheet === 0 && window.innerWidth < 900) setSheet(1); }, { passive: true });
  // tema
  const retheme = () => { colorCache = null; if (map) { map._base.redraw(); drawRoutes(); refreshStops(); refreshPlaces(); } };
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retheme); } catch (e) { /* navegador antiguo */ }
  new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { widthCache.clear(); if (map) map._base.redraw(); });
  window.addEventListener('resize', () => { if (map) map.invalidateSize(); });
  initDictation();
}
function initWebSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return;
  const btn = $('#micBtn'), q = $('#q'); let rec = null;
  btn.hidden = false;
  btn.addEventListener('click', () => {
    if (rec) { rec.stop(); return; }
    let fin = '';
    rec = new SR(); rec.lang = 'es-US'; rec.interimResults = true; rec.maxAlternatives = 1;
    rec.onresult = e => { let tmp = ''; for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) fin += r[0].transcript; else tmp += r[0].transcript; } q.value = (fin + ' ' + tmp).trim(); };
    rec.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { btn.hidden = true; toast('No tengo permiso para usar el micrófono. Puedes escribir a dónde vas.'); } };
    rec.onend = () => { btn.classList.remove('listening'); rec = null; if (fin.trim()) runCommand(fin.trim()); };
    btn.classList.add('listening'); hideSuggest(); q.value = '';
    try { rec.start(); toast('Te escucho. Di, por ejemplo: «llévame a Walmart».'); } catch (e) { btn.classList.remove('listening'); rec = null; }
  });
}
async function initDictation() {
  if (!window.claude) { initWebSpeech(); return; }
  let d = null;
  try { d = window.claude && window.claude.use ? await window.claude.use('dictation') : null; } catch (e) { d = null; }
  if (!d) return;
  const btn = $('#micBtn'), q = $('#q');
  btn.hidden = false;
  let base = '', heard = '';
  d.onPartial(({ text }) => { if (text) q.value = (base + heard + ' ' + text).trim(); });
  d.onFinal(({ text }) => { heard += text; q.value = (base + heard).trim(); d.stop().catch(() => {}); });
  d.onState(({ state, reason }) => {
    const on = state !== 'idle';
    btn.classList.toggle('listening', on); btn.setAttribute('aria-label', on ? 'Dejar de escuchar' : 'Decir a dónde vas');
    if (state === 'idle') {
      if (reason === 'unavailable') btn.hidden = true;
      if (reason === 'not_granted') toast('El micrófono no está permitido. Puedes escribir a dónde vas.');
      const said = heard.trim(); heard = '';
      if (said) runCommand((base + said).trim());
    }
  });
  let lang = 'es';
  btn.addEventListener('click', () => {
    if (d.active()) { d.stop().catch(() => {}); return; }
    base = ''; heard = ''; q.value = ''; hideSuggest();
    d.start(lang ? { language: lang } : undefined).catch(err => {
      const code = err && err.code;
      if (code === 'unavailable' && lang) { lang = null; toast('El dictado en español no está disponible aquí. Toca el micrófono otra vez para usar tu idioma.'); }
      else if (code === 'unavailable') btn.hidden = true;
      else if (code === 'not_granted') toast('El micrófono no está permitido. Puedes escribir a dónde vas.');
    });
    toast('Te escucho. Di, por ejemplo: «llévame a Walmart».');
  });
}

/* ================= Arranque ================= */
async function boot() {
  try {
    const get = u => fetch(u).then(r => { if (!r.ok) throw new Error(u + ' ' + r.status); return r.json(); });
    const [tj, bm, pj] = await Promise.all([get('data/transit.json'), get('data/basemap.json'), get('data/places.json')]);
    const raw = atob(bm.b64 || ''), bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    prepTransit(tj); prepBase(bm, bytes.buffer); prepPlaces(pj);
    initUI(); initMap();
    S.stack = [{ type: 'home' }];
    tick(); render();
    setInterval(tick, 1000);
    $('#loading').hidden = true;
    resumeGPS();
  } catch (e) {
    $('#loadMsg').textContent = 'No se pudieron cargar los datos del mapa. Recarga la página para intentarlo de nuevo.';
    console.error(e);
  }
}
if (!window.L) { $('#loadMsg').textContent = 'No se pudo cargar el mapa. Revisa tu conexión y recarga la página.'; return; }
boot();
})();
